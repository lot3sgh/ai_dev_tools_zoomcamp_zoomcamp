# One-shot bootstrap: runs the pipeline's `ensure_schemas` (idempotent DDL) and
# provisions the read-only `chatbot` + `dashboard` roles. A local sync with an
# empty directory exists exercises env + DB + role provisioning without Drive,
# exactly as docs/deploy.md's container smoke test does.
#
# deploy.sh deletes and recreates this Job after the database is ready.
apiVersion: batch/v1
kind: Job
metadata:
  name: health-pipeline-init
  namespace: health-pipeline
  labels:
    app.kubernetes.io/name: health-pipeline-init
    app.kubernetes.io/part-of: health-pipeline
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: health-pipeline-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: health-pipeline-sync:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - mkdir -p /tmp/empty && python -m pipeline sync --source local --path /tmp/empty
          envFrom:
            - configMapRef: {name: health-pipeline-config}
            - secretRef: {name: health-pipeline-secrets}
