# Traefik ingress (k3s's bundled controller). Path-based so no DNS is required:
#   http://<node-ip>/          -> chat  (the single-page UI)
#   http://<node-ip>/grafana   -> grafana (served from a sub-path)
# Traefik orders routes by path length, so /grafana wins over /.
# LAN-only boundary: the node's Traefik service is a ClusterIP LoadBalancer
# (klipper-lb) bound to the host; do not port-forward it to the internet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: health-pipeline
  namespace: health-pipeline
  labels:
    app.kubernetes.io/part-of: health-pipeline
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chat
                port:
                  number: 8000
