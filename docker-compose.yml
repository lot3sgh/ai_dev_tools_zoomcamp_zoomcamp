services:
  db:
    image: postgres:16-alpine
    container_name: health-pipeline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - health_pipeline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  grafana:
    image: grafana/grafana-oss:latest
    container_name: health-pipeline-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change_me_grafana}
      GF_AUTH_LOGIN_MAX_ATTEMPTS: "10"
      POSTGRES_DB: ${POSTGRES_DB}
      DASHBOARD_DB_PASSWORD: ${DASHBOARD_DB_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      db:
        condition: service_healthy

  # The scheduled sync runner (Phase 1). Runs only on demand or via a timer:
  #   docker compose --profile sync run --rm sync [extra CLI args]
  # It joins the compose network (DB = `db:5432`), reads .env from the mounted repo .env,
  # and authenticates to Drive with the repo's Service Account key mapped to /secrets/sa-key.json.
  # `profiles: ["sync"]` keeps it out of `docker compose up -d`.
  sync:
    build:
      context: .
      dockerfile: Dockerfile
    image: health-pipeline-sync:latest
    profiles: ["sync"]
    restart: "no"
    environment:
      PGHOST: db
      PGPORT: "5432"
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/sa-key.json
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DASHBOARD_DB_PASSWORD: ${DASHBOARD_DB_PASSWORD:-}
    volumes:
      - ./.env:/app/.env:ro
      # Bind the repo's SA key; the container path is always /secrets/sa-key.json.
      # If your key file has a different name, update this bind source (one line).
      - ./wise-weaver-509208-b9-577f86640845.json:/secrets/sa-key.json:ro
    depends_on:
      db:
        condition: service_healthy

  # The Health Assistant chat service (Phase 3). LAN-only: no port-forward, no auth in v1 —
  # the home network is the access boundary. Monorepo shape: the generic core is baked in
  # via the `core` additional build context (docs/deploy.md covers the dev-mount override).
  # `docker compose up -d` brings it up with the rest of the stack; restart preserves the
  # Chat Log, the role grants, and the configuration (conversations are ephemeral by design).
  chat:
    build:
      context: .
      dockerfile: Dockerfile.chat
      additional_contexts:
        core: ./health-assistant-core
    image: health-pipeline-chat:latest
    restart: unless-stopped
    ports:
      - "8000:8000"      # LAN only — never port-forwarded to the internet
    environment:
      PGHOST: db
      PGPORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Read-only Semantic Layer login for run_health_query (provisioned idempotently)
      CHATBOT_DB_PASSWORD: ${CHATBOT_DB_PASSWORD:-}
      # LLM provider seam (see .env.example for the privacy statement):
      # LLM_PROVIDER=stub is the deterministic dev provider; anything else is the
      # OpenAI-compatible gateway selected by the three LLM_* variables below.
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  health_pipeline_pgdata:
  grafana_data: