<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Health Assistant</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Health Assistant</h1>
    <span class="sub">text-to-SQL over your health data · LAN only</span>
  </header>
  <div id="offline"></div>
  <main id="chat"></main>
  <footer>
    <input id="q" type="text" placeholder="e.g. how was my sleep last night?" autocomplete="off" aria-label="Question">
    <button id="send">Ask</button>
  </footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
