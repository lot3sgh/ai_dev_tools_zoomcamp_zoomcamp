[project]
name = "health-assistant-core"
version = "0.1.0"
description = "Generic capability-tool chatbot core: orchestrator, provider adapter seam, tools registry (Phase 4 pod-able core; health tools are registered by the health pipeline repo)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["src/assistant_core"]
ignore_missing_imports = true