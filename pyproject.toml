[project]
name = "ai-dev-tools-zoomcamp-capstone"
version = "0.1.0"
description = "Ingest Google Health takeout archives from Google Drive into Postgres (bronze/silver pipeline)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.150",
    "google-auth>=2.37",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["src/pipeline"]
ignore_missing_imports = true