[project]
name = "ai-dev-tools-zoomcamp-capstone"
version = "0.1.0"
description = "Ingest Google Health takeout archives from Google Drive into Postgres (bronze/silver pipeline)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.150",
    "google-auth>=2.37",
    "psycopg[binary]>=3.2",
    # The Health Assistant service (Phase 3 ticket 02): LAN-only FastAPI + SSE chat.
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "health-assistant-core",
    "httpx>=0.27",          # FastAPI TestClient transport (dev seam for the SSE tests)
    "mypy>=1.13",
    "pytest>=8.3",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline", "src/assistant"]

[tool.uv.sources]
# The generic core lives in its own repo (Phase 4 pod-able core); dev/test only here.
health-assistant-core = { path = "../health-assistant-core" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["src/pipeline", "src/assistant"]
ignore_missing_imports = true